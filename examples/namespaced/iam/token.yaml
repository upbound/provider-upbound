apiVersion: iam.m.upbound.io/v1alpha1
kind: Token
metadata:
  name: access-token
  namespace: default
spec:
  # Recreate deletes and recreates the token if its connection secret is lost.
  connectionSecretRecovery: None
  forProvider:
    name: access-token
    owner:
      type: robots
      idRef:
        name: serviceaccount
  writeConnectionSecretToRef:
    name: up-access-token
